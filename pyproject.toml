[project]
name = "chemcard"
version = "0.3.1"
description = "Inline 2D chemical structure cards for chat explanations (MCP Apps + RDKit)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["chemistry", "rdkit", "mcp", "mcp-apps", "claude", "chatgpt", "smiles", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "mcp>=2.3,<3",
    "rdkit>=2025.3",
]

[project.scripts]
chemcard = "chemcard.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemcard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
